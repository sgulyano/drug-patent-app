# Generic mapping of the DIP site's Thai status vocabulary -> normalised status.
# Rules are matched in order as substrings of the raw status text. First match wins.
# Exact raw strings seen in the DB are also written to the status_map table so they can be edited.
rules:
  - contains: "เพิกถอน"            # revoked
    status: revoked
  - contains: "จะสิ้นอายุ"          # "… will expire on <date>": still in force
    status: granted_active
  - contains: "สิ้นอายุ"           # expired
    status: expired
  - contains: "ยกคำขอ"             # application rejected
    status: abandoned
  - contains: "ละทิ้ง"             # abandoned
    status: abandoned
  - contains: "ถอนคำขอ"            # withdrawn
    status: abandoned
  - contains: "ค่าธรรมเนียมรายปี"   # paying annual fees -> granted & in force
    status: granted_active
  - contains: "หนังสือสำคัญ"        # certificate issued / sent
    status: granted_active
  - contains: "ต่ออายุ"            # petty patent renewed
    status: granted_active
  - contains: "ก่อนรับจด"          # amendment "before registration": still under examination
    status: pending_examining
  - contains: "ก่อนการรับจด"
    status: pending_examining
  - contains: "รับจดทะเบียน"        # registered
    status: granted_active
  - contains: "ตรวจสอบ"            # examination requested / in progress, foreign examination report filed
    status: pending_examining
  - contains: "ตรวจค้น"            # search requested (part of examination)
    status: pending_examining
  - contains: "แก้ไข"              # amendments during examination
    status: pending_examining
  - contains: "จัดทำเอกสารตอบรับ"   # office paperwork during prosecution
    status: pending_examining
  - contains: "ประกาศ"             # published, examination not yet requested
    status: pending_unexamined
default: pending_unexamined
